[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medistock-ai"
version = "0.1.0"
description = "Pharmacy medicine demand forecasting and expiry-risk intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MediStock AI" }]
keywords = ["forecasting", "pharmacy", "inventory", "expiry-risk", "machine-learning"]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pandas>=2.2,<4.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.3,<2.0",
    "pyarrow>=15,<25",
    "plotly>=5.20,<7.0",
    "streamlit>=1.35,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "artifacts", "notebooks", "reports", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends()/Query() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:sklearn.*"]
markers = [
    "slow: tests that take more than a few seconds (training, full pipeline)",
    "integration: tests that cross module or process boundaries",
    "regression: reproducibility and artifact-integrity tests",
]
